<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worksheet Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="no-print">
  <h2>Worksheet Settings</h2>

  <div class="setting-group">
    <p>Question Type (出題形式):</p>
    <label><input type="radio" name="qType" value="en2jp" checked> English to Japanese (和訳)</label><br>
    <label><input type="radio" name="qType" value="jp2en"> Japanese to English (英訳)</label>
  </div>

  <div class="setting-group">
    <p>Target Range (セクション範囲の指定):</p>
    <div class="range-inputs">
      <span>Section</span>
      <input type="number" id="range-start" value="1" min="1">
      <span>〜</span>
      <input type="number" id="range-end" value="20" min="1">
      <button class="small-btn" onclick="applyRange()">Apply Range</button>
    </div>
    
    <div class="quick-buttons">
      <span>Quick Select:</span>
      <button class="small-btn" onclick="setQuickRange(1, 20)">1 - 20</button>
      <button class="small-btn" onclick="setQuickRange(21, 40)">21 - 40</button>
      <button class="small-btn" onclick="setQuickRange(41, 60)">41 - 60</button>
      <button class="small-btn" onclick="setQuickRange(1, 108)">All (1 - 108)</button>
    </div>

    <details style="margin-top: 15px;">
      <summary style="cursor: pointer; font-size: 14px; color: #555;">個別セクションの確認・微調整 (クリックで開閉)</summary>
      <div id="section-checkboxes" class="checkbox-list" style="margin-top: 10px;"></div>
    </details>
  </div>

  <div class="setting-group">
    <p>Number of Questions (出題数):</p>
    <input type="number" id="target-num" value="10" min="1" style="width: 60px;"> 問
    <span class="note">※対象セクションの例文が指定数より少ない場合は、最大数で出力されます。</span>
  </div>

  <button onclick="generateWorksheet()">Generate Worksheet</button>
  <button onclick="window.print()">Print</button>
</div>

<div id="print-area" class="print-area">
  <!-- 生徒用プリント -->
  <div class="worksheet-header">
    <div class="header-left">
      <h2 id="student-header-title"></h2>
      <div id="student-serial-code" class="serial-code"></div>
    </div>
    <div class="student-info">Name: ____________________________________</div>
  </div>
  <ol id="student-questions" class="question-list"></ol>

  <div class="page-break"></div>

  <!-- 解答用プリント -->
  <div class="worksheet-header">
    <div class="header-left">
      <h2 id="teacher-header-title"></h2>
      <div id="teacher-serial-code" class="serial-code"></div>
    </div>
    <div class="answer-label">[ 解答 ]</div>
  </div>
  <ol id="teacher-answers" class="question-list"></ol>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
